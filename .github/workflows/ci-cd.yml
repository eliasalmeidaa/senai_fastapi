name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Build:
    name: Compilar Projeto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Executar testes com pytest
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  Imagem:
    name: Construindo Imagem para Docker
    runs-on: ubuntu-latest
    needs: Build
    if: github.event_name == 'push'
    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push Docker
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            eliasalmeidaa/senai_fastapi:latest
            eliasalmeidaa/senai_fastapi:${{ github.sha }}

      - name: Resumo do deploy
        run: |
          echo "## ✅ Imagem publicada no Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "Tags: eliasalmeidaa/senai_fastapi:latest, eliasalmeidaa/senai_fastapi:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  Deploy:
    name: Implantação AWS
    runs-on: ubuntu-latest
    needs: Imagem
    steps:
      - name: Deploy via SSH na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Faz pull da nova imagem
            sudo docker pull docker.io/eliasalmeidaa/senai_fastapi:latest

            # Para e remove o container atual (ignora erro se não existir)
            sudo docker stop senai_fastapi 2>/dev/null || true
            sudo docker rm senai_fastapi 2>/dev/null || true

            # Sobe o novo container
            sudo docker run -d \
              --name senai_fastapi \
              --restart unless-stopped \
              -p 8080:8080 \
              eliasalmeidaa/senai_fastapi:latest

            # Health check pós-deploy
            sleep 5
            curl -f http://localhost:8080/health || exit 1
            echo "✅ Deploy concluído com sucesso!"

            # Remove imagens antigas
            sudo docker image prune -f
